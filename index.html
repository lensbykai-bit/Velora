<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070b12" />
  <meta name="description" content="VELORA marketplace for buying and selling images with prompts." />
  <title>VELORA — Image & Prompt Marketplace</title>
  <link rel="icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="prompt-market.css" />
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      <a class="brand" href="#home">VELORA</a>
      <div class="top-actions">
        <button class="icon-btn notif-btn" id="notifyBtn" aria-label="Notifications">♧<span>3</span></button>
      </div>
    </header>

    <main id="app">
      <section class="page home-page" id="homePage">
        <button class="search-box" id="searchBtn"><b>⌕</b><span>Search prompts, styles, creators...</span></button>

        <div class="category-strip" id="categoryStrip">
          <button class="category active" data-category="ALL"><i>✿</i><span>All</span></button>
          <button class="category" data-category="Photography"><i>▣</i><span>Photography</span></button>
          <button class="category" data-category="Illustration"><i>✎</i><span>Illustration</span></button>
          <button class="category" data-category="3D / Render"><i>◇</i><span>3D / Render</span></button>
          <button class="category" data-category="Anime"><i>☆</i><span>Anime</span></button>
          <button class="category" data-category="UI / UX"><i>▤</i><span>UI / UX</span></button>
        </div>

        <section class="sell-banner">
          <div>
            <h1>Create More, Earn More</h1>
            <p>Sell your images together with high-quality prompts to creators worldwide.</p>
            <button class="white-btn" data-route="sell">Upload & Sell</button>
          </div>
          <div class="cube-art">◇</div>
        </section>

        <section class="content-section">
          <div class="section-head"><h2>Popular Prompts</h2><button data-route="explore">See All ›</button></div>
          <div class="prompt-grid" id="popularGrid"></div>
        </section>

        <section class="content-section">
          <div class="section-head"><h2>Top Creators</h2><button id="creatorSeeAll">See All</button></div>
          <div class="creator-row" id="creatorRow"></div>
        </section>

        <section class="content-section">
          <div class="section-head"><h2>New Arrivals</h2><button data-route="explore">See All ›</button></div>
          <div class="prompt-grid" id="newGrid"></div>
        </section>
      </section>

      <section class="page hidden" id="dynamicPage"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav active" data-route="home"><i>⌂</i><span>Home</span></button>
      <button class="nav" data-route="explore"><i>⌕</i><span>Explore</span></button>
      <button class="nav upload" data-route="sell"><i>＋</i><span>Upload</span></button>
      <button class="nav" data-route="favorites"><i>♡</i><span>Favorites</span></button>
      <button class="nav" data-route="profile"><i>♙</i><span>Profile</span></button>
    </nav>
  </div>

  <div class="sheet hidden" id="sheet"><div class="sheet-card" id="sheetCard"></div></div>
  <script src="prompt-market.js"></script>
</body>
</html>
